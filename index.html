<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Трудозатраты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--ac:#2563eb;--acx:#fff;--bd:rgba(128,128,128,.28);--dn:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#101215;--card:#1a1d21;--tx:#eceef1;--mut:#9aa1ab;--ac:#4f8cff;--acx:#08101f;--dn:#f87171}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
textarea{resize:vertical}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{flex:1;min-width:52px;padding:10px 0;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;font:inherit;text-align:center}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font:inherit;font-weight:600}
.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd);margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.top input{margin:0;width:auto}
.item{display:flex;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}
.item .m{flex:1}
.item .w{font-weight:600}
.item .s{color:var(--mut);font-size:14px}
.item button{border:0;background:none;color:var(--dn);font-size:18px;padding:4px 8px}
.rowb{display:flex;gap:8px}
.mic{width:52px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;font-size:20px}
.mic.on{background:var(--dn);color:#fff}
.tot{font-weight:600}
.mut{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Трудозатраты</h1>

<div class="card">
<textarea id="q" rows="2" placeholder="Быстрая запись: «Иванов сброс пароля 10 минут». Диктуй кнопкой микрофона на клавиатуре."></textarea>
<div class="rowb"><button class="btn" id="qadd">Записать</button><button class="mic" id="mic" hidden aria-label="Голосовой ввод">🎤</button></div>
<div class="mut" id="qmsg" style="margin-top:6px"></div>
</div>

<div class="card">
<input id="who" list="whos" maxlength="80" placeholder="Кто обратился" autocomplete="off">
<datalist id="whos"></datalist>
<textarea id="what" rows="2" maxlength="500" placeholder="Что сделал (например, сброс пароля)"></textarea>
<div class="row" id="chips"></div>
<input id="min" type="number" inputmode="numeric" min="1" max="999" placeholder="Или свои минуты">
<button class="btn" id="add">Добавить</button>
</div>

<div class="card">
<div class="top">
<input type="date" id="date">
<span class="tot" id="tot"></span>
</div>
<div id="list"><div class="mut">Загрузка…</div></div>
</div>

<div class="card">
<div class="mut" style="margin-bottom:6px">Текст для переноса в Битрикс24</div>
<textarea id="out" rows="7" readonly></textarea>
<button class="btn" id="copy">Скопировать</button>
<button class="btn sec" id="clear">Очистить выбранный день</button>
</div>

<div class="card">
<div class="mut" style="margin-bottom:6px">Резервная копия и перенос записей из старой версии: вставь текст сюда и нажми «Восстановить».</div>
<textarea id="bk" rows="3" placeholder="Текст резервной копии"></textarea>
<button class="btn sec" id="bkcopy" style="margin-top:0">Скопировать все записи</button>
<button class="btn sec" id="bkload">Восстановить из текста</button>
</div>

<p class="mut" id="st"></p>
</main>

<script>
(function(){
var KEEP=90;            // сколько дней хранить записи в Telegram
var CHUNK=3800;         // лимит значения в CloudStorage — 4096 символов
var LS="trudozatraty-v1";
var tg=window.Telegram&&window.Telegram.WebApp, cs=null;
if(tg){try{tg.ready();tg.expand()}catch(e){}}
if(tg&&tg.initData&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast("6.9")){cs=tg.CloudStorage}

function theme(){
if(!tg||!tg.themeParams)return;
var p=tg.themeParams,s=document.documentElement.style;
function v(k,c){if(p[c])s.setProperty(k,p[c])}
v("--bg","secondary_bg_color");v("--card","bg_color");v("--tx","text_color");
v("--mut","hint_color");v("--ac","button_color");v("--acx","button_text_color")}
theme();
if(tg&&tg.onEvent){try{tg.onEvent("themeChanged",theme)}catch(e){}}

var $=function(i){return document.getElementById(i)};
var data=[],keys=[],pending=0,dur=0,base="",stT=null;
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return ymd(new Date())}
function cutoff(){var d=new Date();d.setDate(d.getDate()-KEEP);return ymd(d)}
function st(msg){
var el=$("st");
if(!msg){el.textContent=base;return}
el.textContent=msg;clearTimeout(stT);stT=setTimeout(function(){el.textContent=base},3500)}
base=cs?"Хранилище: Telegram, записи общие на всех твоих устройствах. Записи старше "+KEEP+" дней удаляются."
:"Хранилище: этот браузер (вне Telegram данные не синхронизируются).";
$("st").textContent=base;
$("date").value=today();

/* ---------- хранилище ---------- */
function pack(date){
var items=data.filter(function(e){return e.date===date}).map(function(e){return [e.id,e.time,e.who,e.what,e.min]});
var ch=[],cur=[];
items.forEach(function(it){
cur.push(it);
if(JSON.stringify(cur).length>CHUNK&&cur.length>1){cur.pop();ch.push(cur);cur=[it]}});
if(cur.length)ch.push(cur);
return ch.map(function(c){return JSON.stringify(c)})}

function saveDay(date){
if(!cs){try{localStorage.setItem(LS,JSON.stringify(data))}catch(e){}return}
var vals=pack(date),want={},pre="d_"+date+"_";
vals.forEach(function(v,i){want[pre+i]=v});
Object.keys(want).forEach(function(k){
pending++;
cs.setItem(k,want[k],function(err){pending--;if(err)st("Ошибка сохранения, попробуй ещё раз")});
if(keys.indexOf(k)<0)keys.push(k)});
var rm=keys.filter(function(k){return k.indexOf(pre)===0&&!(k in want)});
if(rm.length){
pending++;
cs.removeItems(rm,function(err){pending--;if(!err)keys=keys.filter(function(k){return rm.indexOf(k)<0})})}}

function loadLocal(){
try{var a=JSON.parse(localStorage.getItem(LS)||"[]");data=Array.isArray(a)?a:[]}catch(e){data=[]}}

function loadCloud(done){
cs.getKeys(function(err,ks){
if(err||!ks){st("Не удалось загрузить записи");done();return}
ks=ks.filter(function(k){return /^d_\d{4}-\d{2}-\d{2}_\d+$/.test(k)});
var cut=cutoff(),old=ks.filter(function(k){return k.slice(2,12)<cut});
if(old.length){ks=ks.filter(function(k){return old.indexOf(k)<0});cs.removeItems(old,function(){})}
keys=ks.slice();
var out=[],i=0;
(function next(){
if(i>=ks.length){data=out;done();return}
var part=ks.slice(i,i+50);i+=50;
cs.getItems(part,function(e2,vals){
if(!e2&&vals){part.forEach(function(k){
try{JSON.parse(vals[k]||"[]").forEach(function(a){out.push({id:a[0],date:k.slice(2,12),time:a[1],who:a[2],what:a[3],min:a[4]})})}catch(x){}})}
next()})})()})}

/* ---------- интерфейс ---------- */
var chips=$("chips");
[5,10,15,30,60].forEach(function(m){
var b=document.createElement("button");b.className="chip";b.textContent=m;
b.onclick=function(){dur=m;$("min").value="";mark()};chips.appendChild(b)});
function mark(){[].forEach.call(chips.children,function(c){c.classList.toggle("on",+c.textContent===dur)})}
$("min").oninput=function(){dur=0;mark()};
function fmt(m){var h=Math.floor(m/60),r=m%60;return h?h+" ч "+(r?r+" мин":""):r+" мин"}
function dayItems(){var d=$("date").value;return data.filter(function(e){return e.date===d})}

function render(){
var items=dayItems(),sum=0,l=$("list");l.innerHTML="";
items.forEach(function(e){
sum+=e.min;
var r=document.createElement("div");r.className="item";
var m=document.createElement("div");m.className="m";
var w=document.createElement("div");w.className="w";w.textContent=e.who||"Без имени";
var s=document.createElement("div");s.className="s";s.textContent=e.time+" · "+e.min+" мин"+(e.what?" · "+e.what:"");
m.appendChild(w);m.appendChild(s);
var x=document.createElement("button");x.textContent="✕";x.setAttribute("aria-label","Удалить");
x.onclick=function(){data=data.filter(function(z){return z.id!==e.id});saveDay(e.date);render()};
r.appendChild(m);r.appendChild(x);l.appendChild(r)});
if(!items.length){l.innerHTML='<div class="mut">Записей за этот день нет</div>'}
$("tot").textContent=items.length?items.length+" обр. · "+fmt(sum):"";
$("out").value=items.map(function(e,i){return (i+1)+". "+(e.who||"—")+" — "+(e.what||"обращение")+" — "+e.min+" мин"}).join("\n")+(items.length?"\n\nИтого: "+fmt(sum):"");
var names=[];data.forEach(function(e){if(e.who&&names.indexOf(e.who)<0)names.push(e.who)});
$("whos").innerHTML="";names.forEach(function(n){var o=document.createElement("option");o.value=n;$("whos").appendChild(o)})}

$("add").onclick=function(){
var m=dur||parseInt($("min").value,10);
if(!m||m<1){$("min").focus();return}
var n=new Date(),date=$("date").value;
data.push({id:Date.now(),date:date,time:String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"),who:$("who").value.trim(),what:$("what").value.trim(),min:m});
saveDay(date);$("who").value="";$("what").value="";$("min").value="";dur=0;mark();render();$("who").focus()};
$("date").onchange=render;

$("copy").onclick=function(){
var t=$("out").value,b=$("copy");
function ok(){b.textContent="Скопировано ✓";setTimeout(function(){b.textContent="Скопировать"},1500)}
function fb(){$("out").select();try{document.execCommand("copy");ok()}catch(e){}}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fb)}else{fb()}};

var clrT=null;
$("clear").onclick=function(){
var b=$("clear");
if(!dayItems().length)return;
if(!clrT){b.textContent="Нажми ещё раз, чтобы удалить день";clrT=setTimeout(function(){clrT=null;b.textContent="Очистить выбранный день"},3000);return}
clearTimeout(clrT);clrT=null;b.textContent="Очистить выбранный день";
var d=$("date").value;data=data.filter(function(e){return e.date!==d});saveDay(d);render()};

$("bkcopy").onclick=function(){
var t=JSON.stringify(data),b=$("bkcopy");$("bk").value=t;$("bk").select();
try{if(navigator.clipboard)navigator.clipboard.writeText(t)}catch(e){}
try{document.execCommand("copy")}catch(e){}
b.textContent="Скопировано ✓";setTimeout(function(){b.textContent="Скопировать все записи"},1500)};

$("bkload").onclick=function(){
var b=$("bkload");
function msg(t){b.textContent=t;setTimeout(function(){b.textContent="Восстановить из текста"},2000)}
try{
var a=JSON.parse($("bk").value);if(!Array.isArray(a))throw 0;
var ids={},dates={},cut=cutoff(),added=0;
data.forEach(function(e){ids[e.id]=1});
a.forEach(function(e){
if(!e||!e.id||ids[e.id]||typeof e.date!=="string"||!(e.min>0))return;
if(cs&&e.date<cut)return;
ids[e.id]=1;dates[e.date]=1;added++;
data.push({id:e.id,date:e.date,time:String(e.time||""),who:String(e.who||"").slice(0,80),what:String(e.what||"").slice(0,500),min:+e.min})});
Object.keys(dates).forEach(saveDay);
render();$("bk").value="";msg("Добавлено записей: "+added)
}catch(e){msg("Не удалось прочитать текст")}};

/* ---------- быстрая запись одной фразой ---------- */
var W={"пять":5,"десять":10,"пятнадцать":15,"двадцать":20,"тридцать":30,"сорок":40,"пятьдесят":50,"шестьдесят":60};
function lw(s){return String(s||"").toLowerCase().replace(/[.,;!?]+$/,"")}
function numAt(tk,i){
var w=lw(tk[i]);
if(/^\d+$/.test(w))return [+w,1];
if(W.hasOwnProperty(w)){var v=W[w];if(v>=20&&v<=50&&lw(tk[i+1])==="пять")return [v+5,2];return [v,1]}
return null}
function parseQ(s){
var tk=s.replace(/[;!?]/g," ").split(/\s+/).filter(Boolean),mins=0,used={},i,n,u,m2;
for(i=0;i<tk.length;i++){
if(lw(tk[i])==="полчаса"){mins=30;used[i]=1;break}
n=numAt(tk,i);
if(n&&tk[i+n[1]]){
u=lw(tk[i+n[1]]);
if(u.indexOf("мин")===0){mins=n[0];for(var a=0;a<=n[1];a++)used[i+a]=1;break}
if(u.indexOf("час")===0||u==="ч"){
mins=n[0]*60;for(var b=0;b<=n[1];b++)used[i+b]=1;
var j=i+n[1]+1;m2=numAt(tk,j);
if(m2&&tk[j+m2[1]]&&lw(tk[j+m2[1]]).indexOf("мин")===0){mins+=m2[0];for(var c=0;c<=m2[1];c++)used[j+c]=1}
break}}}
if(!mins){var last=tk.length-1,nl=last>0?numAt(tk,last):null;if(nl&&nl[1]===1){mins=nl[0];used[last]=1}}
var rest=tk.filter(function(_,k){return !used[k]});
return {who:rest[0]||"",what:rest.slice(1).join(" "),min:mins}}
function addEntry(who,what,m){
var n=new Date(),date=$("date").value;
data.push({id:Date.now(),date:date,time:String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"),who:who.slice(0,80),what:what.slice(0,500),min:m});
saveDay(date);render()}
$("qadd").onclick=function(){
var raw=$("q").value.trim(),msg=$("qmsg");
if(!raw)return;
var p=parseQ(raw);
p.who=p.who.charAt(0).toUpperCase()+p.who.slice(1);
if(p.who&&p.min>0&&p.min<1000){
addEntry(p.who,p.what,p.min);$("q").value="";
msg.textContent="Добавлено: "+p.who+" — "+(p.what||"обращение")+" — "+p.min+" мин"
}else{
$("who").value=p.who;$("what").value=p.what;dur=0;mark();$("min").value=p.min||"";
msg.textContent="Не удалось определить "+(p.min?"фамилию":"минуты")+". Проверь поля ниже и нажми «Добавить»."}};
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
var mic=$("mic"),rec=null;mic.hidden=false;
mic.onclick=function(){
if(rec){rec.stop();return}
rec=new SR();rec.lang="ru-RU";rec.interimResults=false;
rec.onresult=function(e){var t="";for(var k=0;k<e.results.length;k++)t+=e.results[k][0].transcript+" ";$("q").value=t.trim()};
rec.onerror=function(e){$("qmsg").textContent="Микрофон недоступен ("+(e.error||"ошибка")+"). Используй микрофон на клавиатуре."};
rec.onend=function(){rec=null;mic.classList.remove("on")};
mic.classList.add("on");
try{rec.start()}catch(x){rec=null;mic.classList.remove("on")}}}

/* ---------- запуск ---------- */
function start(){
if(cs){loadCloud(render)}else{loadLocal();render()}}
start();
document.addEventListener("visibilitychange",function(){
if(cs&&!document.hidden&&pending===0){loadCloud(render)}});
})();
</script>
</body>
</html>
